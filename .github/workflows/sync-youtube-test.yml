name: Sync test YouTube channels

on:
  push:
    branches: [main]
    paths:
      - 'test/youtube/channels.json'
      - 'test/youtube/rules.json'
      - 'scripts/build-youtube-media.mjs'
      - 'scripts/build-youtube-media.test.mjs'
  workflow_dispatch:

permissions:
  contents: write

# Serialize both environments so their generated commits do not race.
concurrency:
  group: sync-youtube
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify synchronization logic
        run: node --test scripts/sync-youtube.test.mjs scripts/build-youtube-media.test.mjs
      - name: Fetch raw test YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/sync-youtube.mjs test/youtube
      - name: Apply test media tagging rules
        run: node scripts/build-youtube-media.mjs test/youtube
      - name: Commit test YouTube data
        run: |
          git add test/youtube/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update raw test YouTube channel data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
