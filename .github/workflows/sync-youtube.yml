name: Sync YouTube channels

on:
  push:
    branches: [main]
    paths:
      - 'youtube/channels.json'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-youtube
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify synchronization logic
        run: node --test scripts/sync-youtube.test.mjs
      - name: Fetch raw YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/sync-youtube.mjs
      - name: Commit YouTube data
        run: |
          git add youtube/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update raw YouTube channel data'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
